<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>10X Memory Power Techniques - Hindi/English</title>
  <link rel="stylesheet" href="css/index.css">
  <link rel="shortcut icon" href="assets/favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/intl-tel-input@18.2.1/build/css/intlTelInput.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <div class="main">
    <!-- Header -->
    <div class="header" style="display:flex; justify-content:center;">
      <img style="width:170px;" src="assets/untitled-2.png" alt="logo">
    </div>
    <!-- Hero Section -->
    <div id="hero-section">
      <h2 class="hero-h2">10X Memory Power Techniques - Hindi/English</h2>
      <div class="hero-img">
        <img src="https://d3jt6ku4g6z5l8.cloudfront.net/IMAGE/693ac56b430f4d0d89a67de3/5059898_ChatGPT%20Image%20Sep%201%202026%20121522%20PM.png" alt="">
      </div>
    </div>
    <!-- Form -->
    <div id="form-div">
      <form id="form">
        <div id="user-section">
          <div class="form-group">
            <label>Full Name</label>
            <input type="text" id="name" placeholder="Full Name" required>
          </div>
          <div class="form-group">
            <label>Phone Number</label>
            <input type="tel" id="wanumber" placeholder="Enter your WhatsApp number" required>
          </div>
          <div class="form-group">
            <label>Email</label>
            <input type="email" id="email" placeholder="Email">
          </div>
          <div class="form-group">
            <label>School Name</label>
            <textarea id="reason" placeholder="Enter School Name" required></textarea>
          </div>
          <div class="form-group">
            <label>School Area</label>
            <input type="text" id="schoolArea" required>
          </div>
          <div class="form-group">
            <label>Class</label>
            <input type="text" id="className" required>
          </div>
          <div class="form-group">
            <label>City</label>
            <input type="text" id="city" required>
          </div>
        </div>
        <button type="button" id="submitBtn" onclick="submitForm()">
          Register for Webinar
        </button>
      </form>
    </div>
  </div>
  <script>
    function setLoading(isLoading) {
      const btn = document.getElementById('submitBtn');
      btn.textContent = isLoading ? 'Loading...' : 'Register for Webinar';
      btn.disabled = isLoading;
    }

    function submitForm() {
      const name = document.getElementById('name').value.trim();
      const phone = document.getElementById('wanumber').value.trim();
      if (!name) {
        alert('Please enter your full name.');
        return;
      }
      if (!phone || !/^\d{10}$/.test(phone)) {
        alert('Enter valid 10-digit phone number.');
        return;
      }
      setLoading(true);
      const cleanPhone = phone.replace(/\D/g, '');
      const formData = {
        fullName: name,
        phoneNumber: cleanPhone,
        email: document.getElementById('email').value,
        schoolName: document.getElementById('reason').value,
        schoolArea: document.getElementById('schoolArea').value,
        class: document.getElementById('className').value,
        city: document.getElementById('city').value
      };

      // Save to Google Sheets (no-cors POST)
      fetch('https://script.google.com/macros/s/AKfycbzFc1XUTFZj0RkL1tvK8l2tOkkw9D683Kdht_Rq7YnbtR78BmTUsDRDNKr5S73tYGK-/exec', {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(formData),
      }).catch(() => {/* ignore no-cors errors */});

      // AiSensy WhatsApp API payload
      const aiSensyData = {
        apiKey: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpZCI6IjY5M2FjNTZiNDMwZjRkMGQ4OWE2N2RlMyIsIm5hbWUiOiJQQURITyBJTkRJQSBDTFVCIiwiYXBwTmFtZSI6IkFpU2Vuc3kiLCJjbGllbnRJZCI6IjY3MmRhNDQ1ZTU4N2NkMGJlZDcxZTM1MyIsImFjdGl2ZVBsYW4iOiJGUkVFX0ZPUkVWRVIiLCJpYXQiOjE3NjU0NTkzMDd9.9jx0SMynu-kuzazRs9KI4Sds_sEI5QzRO0U_hngWG20",
        campaignName: "reminder_v22v20_xiu46_dxu07_1xe6d_mrv02",
        destination: `91${cleanPhone}`,
        userName: name,
        templateParams: ["13th September 2026"],
        source: "new-landing-page form",
        media: {
          url: "https://d3jt6ku4g6z5l8.cloudfront.net/IMAGE/693ac56b430f4d0d89a67de3/5059898_ChatGPT%20Image%20Sep%201%202026%20121522%20PM.png",
          filename: "sample_media"
        }
      };

      fetch('https://backend.aisensy.com/campaign/t1/api/v2', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(aiSensyData),
      })
      .then(() => {
        setLoading(false);
        window.location.href = "https://chat.whatsapp.com/EDeb6DBtOz3Fb8vDV53Mx0?s=cl&p=a&ilr=1";
      })
      .catch(() => {
        setLoading(false);
        alert('Registration failed. Please try again.');
      });
    }
  </script>
</body>
</html>
